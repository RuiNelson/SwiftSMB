<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="smb-t">
  <title id="smb-t">SwiftSMB — SMB2 and SMB3 file shares for Swift</title>
  <defs>
    <linearGradient id="smb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090B10"/>
      <stop offset="1" stop-color="#14171F"/>
    </linearGradient>
    <radialGradient id="smb-glowR" cx="1010" cy="160" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="smb-glowL" cx="150" cy="160" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#64D2FF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#64D2FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="smb-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6FD6FF"/>
      <stop offset="0.55" stop-color="#1E8BFF"/>
      <stop offset="1" stop-color="#5A4FE0"/>
    </linearGradient>
    <linearGradient id="smb-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="smb-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6FD6FF"/>
      <stop offset="1" stop-color="#3D8BFF"/>
    </linearGradient>
    <pattern id="smb-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.1" fill="#fff"/>
    </pattern>
    <linearGradient id="smb-fade" x1="560" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.35"/>
    </linearGradient>
    <mask id="smb-dotmask"><rect x="560" y="0" width="720" height="320" fill="url(#smb-fade)"/></mask>
    <filter id="smb-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="smb-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E8BFF" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#smb-bg)"/>
  <rect width="1280" height="320" fill="url(#smb-glowL)"/>
  <rect width="1280" height="320" fill="url(#smb-glowR)"/>
  <rect x="560" width="720" height="320" fill="url(#smb-dots)" opacity="0.10" mask="url(#smb-dotmask)"/>

  <!-- App-icon tile -->
  <g filter="url(#smb-glow)">
    <rect x="80" y="96" width="128" height="128" rx="30" fill="url(#smb-tile)"/>
  </g>
  <rect x="80" y="96" width="128" height="128" rx="30" fill="url(#smb-sheen)"/>
  <rect x="80.5" y="96.5" width="127" height="127" rx="29.5" fill="none" stroke="#fff" stroke-opacity="0.28"/>
  <!-- two stacked shares / drives -->
  <rect x="106" y="128" width="76" height="28" rx="9" fill="#fff" fill-opacity="0.96"/>
  <rect x="106" y="164" width="76" height="28" rx="9" fill="#fff" fill-opacity="0.96"/>
  <circle cx="121" cy="142" r="4" fill="#1E8BFF"/>
  <circle cx="121" cy="178" r="4" fill="#1E8BFF"/>
  <rect x="135" y="140" width="36" height="4" rx="2" fill="#1E8BFF" fill-opacity="0.35"/>
  <rect x="135" y="176" width="36" height="4" rx="2" fill="#1E8BFF" fill-opacity="0.35"/>
  <!-- link to the client -->
  <path d="M144 192v10M122 202h44" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="122" cy="204" r="4.5" fill="#fff"/>
  <circle cx="166" cy="204" r="4.5" fill="#fff"/>
  <circle cx="144" cy="204" r="4.5" fill="#fff"/>

  <!-- Wordmark -->
  <g font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="248" y="106" font-size="13" font-weight="600" letter-spacing="2.6" fill="#64B5FF">SWIFT PACKAGE</text>
    <text x="246" y="164" font-size="62" font-weight="700" letter-spacing="-1.8" fill="#fff">Swift<tspan fill="url(#smb-word)">SMB</tspan></text>
    <text x="248" y="198" font-size="22" font-weight="400" fill="#A1A1AA">SMB2 and SMB3 file shares for Swift.</text>
    <text x="248" y="238" font-size="13.5" font-weight="500" letter-spacing="0.2" fill="#8E8E93">macOS  ·  iOS  ·  visionOS  ·  watchOS  ·  tvOS  ·  Linux  ·  Android</text>
  </g>

  <!-- Code window -->
  <g filter="url(#smb-shadow)">
    <rect x="760" y="56" width="440" height="208" rx="16" fill="#1B1D24"/>
  </g>
  <rect x="760.5" y="56.5" width="439" height="207" rx="15.5" fill="none" stroke="#fff" stroke-opacity="0.10"/>
  <path d="M760.5 98.5h439" stroke="#fff" stroke-opacity="0.07"/>
  <circle cx="782" cy="77" r="5.5" fill="#FF5F57"/>
  <circle cx="800" cy="77" r="5.5" fill="#FEBC2E"/>
  <circle cx="818" cy="77" r="5.5" fill="#28C840"/>
  <text x="980" y="81" text-anchor="middle" font-family="'SF Pro Text', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8E8E93">Shares.swift</text>
  <g font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14.5" xml:space="preserve" fill="#E5E5EA">
    <text x="784" y="126"><tspan fill="#FC5FA3">import</tspan> SwiftSMB</text>
    <text x="784" y="164"><tspan fill="#FC5FA3">let</tspan> shares = <tspan fill="#FC5FA3">try await</tspan> <tspan fill="#5DD8FF">SMB</tspan>.<tspan fill="#67B7A4">listShares</tspan>(</text>
    <text x="784" y="188">    server: server,</text>
    <text x="784" y="212">    credentials: credentials</text>
    <text x="784" y="236">)</text>
  </g>
</svg>
