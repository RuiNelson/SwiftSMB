name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: swiftlang/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test --filter 'TypeTests|SMBPublicAPITests|DataPipeTests'

  linux:
    name: Linux
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test --filter 'TypeTests|SMBPublicAPITests|DataPipeTests'
