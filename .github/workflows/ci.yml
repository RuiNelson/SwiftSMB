name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SWIFTSMB_SKIP_INTEGRATION_TESTS: "1"

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test

  linux:
    name: Linux
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test
