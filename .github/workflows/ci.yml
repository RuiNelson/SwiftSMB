name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: swift build

      - name: Unit tests
        run: |
          swift build --target SwiftSMBUnitTests
          swift test --filter 'SwiftSMBUnitTests\.' --skip-build

  linux:
    name: Linux
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: swift build

      - name: Unit tests
        run: |
          swift build --target SwiftSMBUnitTests
          swift test --filter 'SwiftSMBUnitTests\.' --skip-build
