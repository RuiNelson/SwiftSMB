name: Apple

on:
  push:
  pull_request:

concurrency:
  group: apple-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SWIFTSMB_SKIP_INTEGRATION_TESTS: "1"

jobs:
  macos:
    # Pushes already run CI for this repository's branches; only pull requests from forks need their own run.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    name: macOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.4"

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build --scratch-path /tmp/swift-build -v

      - name: Test (offline)
        run: swift test --scratch-path /tmp/swift-test
